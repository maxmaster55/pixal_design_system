# Glowgrid forge colours for fuzzel. `glowgrid-theme` points
# ~/.local/state/glowgrid/fuzzel-colors.ini at this file, and fuzzel.ini
# includes that path. Format is RRGGBBAA. Only the lights differ between
# themes: accent ff9a3c (ring, prompt, matches, selected row), accent-hot ffc56a
# (typed text).
[colors]
background=170d24ff
text=e9def0ff
prompt=ff9a3cff
input=ffc56aff
match=ff9a3cff
placeholder=a493b0ff
selection=ff9a3cff
selection-text=1c1226ff
selection-match=3a1206ff
border=ff9a3cff
