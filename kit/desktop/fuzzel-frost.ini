# Glowgrid frost colours for fuzzel. `glowgrid-theme` points
# ~/.local/state/glowgrid/fuzzel-colors.ini at this file, and fuzzel.ini
# includes that path. Format is RRGGBBAA. Only the lights differ between
# themes: accent 4bc6e9 (ring, prompt, matches, selected row), accent-hot bdf0ff
# (typed text).
[colors]
background=170d24ff
text=e9def0ff
prompt=4bc6e9ff
input=bdf0ffff
match=4bc6e9ff
placeholder=a493b0ff
selection=4bc6e9ff
selection-text=1c1226ff
selection-match=0b2a3aff
border=4bc6e9ff
