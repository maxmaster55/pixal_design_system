# Glowgrid ember colours for fuzzel. `glowgrid-theme` points
# ~/.local/state/glowgrid/fuzzel-colors.ini at this file, and fuzzel.ini
# includes that path. Format is RRGGBBAA. Only the lights differ between
# themes: accent ff8a2a (ring, prompt, matches, selected row), accent-hot ffd36b
# (typed text).
[colors]
background=170d24ff
text=e9def0ff
prompt=ff8a2aff
input=ffd36bff
match=ff8a2aff
placeholder=a493b0ff
selection=ff8a2aff
selection-text=1c1226ff
selection-match=3a1206ff
border=ff8a2aff
